services:
  - type: web
    name: mychandha-core-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health/readiness
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mychandha-postgres
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: mychandha-postgres
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: mychandha-postgres
          property: password
      - key: SUPABASE_PROJECT_URL
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWKS_URI
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75

databases:
  - name: mychandha-postgres
    databaseName: mychandha
    user: mychandha_app
