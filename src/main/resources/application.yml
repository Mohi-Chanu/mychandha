spring:
  application:
    name: mychandha-platform
  datasource:
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MIN_IDLE:2}
      connection-timeout: 5000
      validation-timeout: 3000
  flyway:
    enabled: false
    clean-disabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      enabled: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Keep the socket peer address intact. The rate-limit adapter applies the
  # explicit trusted-proxy boundary before accepting X-Forwarded-For.
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
      runtime: ${mychandha.runtime.profile:unknown}

mychandha:
  runtime:
    profile: unknown
  identity:
    provider: supabase
    issuer: ${SUPABASE_JWT_ISSUER:https://placeholder.supabase.co/auth/v1}
    jwk-set-uri: ${SUPABASE_JWKS_URI:${mychandha.identity.issuer}/.well-known/jwks.json}
    audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
  outbox:
    poll-delay: ${OUTBOX_POLL_DELAY:PT1S}
    lock-timeout: ${OUTBOX_LOCK_TIMEOUT:PT2M}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:12}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    cache-maximum-size: ${RATE_LIMIT_CACHE_MAXIMUM_SIZE:10000}
    cache-expire-after-access: ${RATE_LIMIT_CACHE_EXPIRE_AFTER_ACCESS:PT10M}
    client-address-strategy: ${RATE_LIMIT_CLIENT_ADDRESS_STRATEGY:direct}
    trusted-proxy-cidrs: ${RATE_LIMIT_TRUSTED_PROXY_CIDRS:}
    client-address:
      capacity: ${RATE_LIMIT_CLIENT_CAPACITY:120}
      refill-period: ${RATE_LIMIT_CLIENT_REFILL_PERIOD:PT1M}
    subject:
      capacity: ${RATE_LIMIT_SUBJECT_CAPACITY:60}
      refill-period: ${RATE_LIMIT_SUBJECT_REFILL_PERIOD:PT1M}
    organization:
      capacity: ${RATE_LIMIT_ORGANIZATION_CAPACITY:300}
      refill-period: ${RATE_LIMIT_ORGANIZATION_REFILL_PERIOD:PT1M}
    metrics:
      capacity: ${RATE_LIMIT_METRICS_CAPACITY:30}
      refill-period: ${RATE_LIMIT_METRICS_REFILL_PERIOD:PT1M}
    process:
      capacity: ${RATE_LIMIT_PROCESS_CAPACITY:2000}
      refill-period: ${RATE_LIMIT_PROCESS_REFILL_PERIOD:PT1M}

logging:
  pattern:
    level: "%5p [runtimeProfile=${mychandha.runtime.profile:unknown} requestId=%X{requestId:-} correlationId=%X{correlationId:-} traceId=%X{traceId:-} spanId=%X{spanId:-}]"
