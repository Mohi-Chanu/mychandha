spring:
  main:
    web-application-type: none
  datasource:
    url: ${DISPATCHER_DATABASE_URL}
    username: ${DISPATCHER_DATABASE_USERNAME}
    password: ${DISPATCHER_DATABASE_PASSWORD}
  flyway:
    enabled: false
  task:
    scheduling:
      enabled: true

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,startup,durableDelivery
        startup:
          include: startup

mychandha:
  runtime:
    profile: dispatcher
