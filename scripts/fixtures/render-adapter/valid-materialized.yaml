previews:
  generation: off
services:
  - type: web
    name: approved-api-fixture
    runtime: image
    plan: starter
    region: singapore
    numInstances: 1
    maxShutdownDelaySeconds: 30
    image:
      url: registry.example.invalid/mychandha@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production,api
      - key: API_DATABASE_URL
        sync: false
      - key: API_DATABASE_USERNAME
        sync: false
      - key: API_DATABASE_PASSWORD
        sync: false
      - key: API_DATABASE_SSL_ROOT_CERTIFICATE
        value: /etc/secrets/supabase-ca.crt
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWKS_URI
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_CLIENT_ADDRESS_STRATEGY
        value: render-edge-first-hop
  - type: worker
    name: approved-dispatcher-fixture
    runtime: image
    plan: starter
    region: singapore
    numInstances: 1
    maxShutdownDelaySeconds: 30
    image:
      url: registry.example.invalid/mychandha@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production,dispatcher
      - key: DISPATCHER_DATABASE_URL
        sync: false
      - key: DISPATCHER_DATABASE_USERNAME
        sync: false
      - key: DISPATCHER_DATABASE_PASSWORD
        sync: false
      - key: DISPATCHER_DATABASE_SSL_ROOT_CERTIFICATE
        value: /etc/secrets/supabase-ca.crt
