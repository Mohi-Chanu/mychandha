spring:
  main:
    web-application-type: none
  datasource:
    url: ${MIGRATION_DATABASE_URL}
    username: ${MIGRATION_DATABASE_USERNAME}
    password: ${MIGRATION_DATABASE_PASSWORD}
  flyway:
    enabled: true
  task:
    scheduling:
      enabled: false

mychandha:
  runtime:
    profile: migration

---
spring:
  config:
    activate:
      on-profile: production
  datasource:
    hikari:
      data-source-properties:
        sslmode: verify-full
        sslrootcert: ${MIGRATION_DATABASE_SSL_ROOT_CERTIFICATE}
