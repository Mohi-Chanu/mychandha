spring:
  main:
    web-application-type: none
  datasource:
    url: ${DISPATCHER_DATABASE_URL}
    username: ${DISPATCHER_DATABASE_USERNAME}
    password: ${DISPATCHER_DATABASE_PASSWORD}
  flyway:
    enabled: false
  task:
    scheduling:
      enabled: true

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,startupState,durableDelivery
        startup:
          include: startupState

mychandha:
  runtime:
    profile: dispatcher

---
spring:
  config:
    activate:
      on-profile: production
  datasource:
    hikari:
      data-source-properties:
        sslmode: verify-full
        sslrootcert: ${DISPATCHER_DATABASE_SSL_ROOT_CERTIFICATE}
