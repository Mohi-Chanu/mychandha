spring:
  application:
    name: mychandha-platform
  datasource:
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MIN_IDLE:2}
      connection-timeout: 5000
      validation-timeout: 3000
  flyway:
    enabled: false
    clean-disabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      enabled: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
      runtime: ${mychandha.runtime.profile:unknown}

mychandha:
  runtime:
    profile: unknown
  identity:
    provider: supabase
    issuer: ${SUPABASE_JWT_ISSUER:https://placeholder.supabase.co/auth/v1}
    jwk-set-uri: ${SUPABASE_JWKS_URI:${mychandha.identity.issuer}/.well-known/jwks.json}
    audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
  outbox:
    poll-delay: ${OUTBOX_POLL_DELAY:PT1S}
    lock-timeout: ${OUTBOX_LOCK_TIMEOUT:PT2M}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:12}

logging:
  pattern:
    level: "%5p [runtimeProfile=${mychandha.runtime.profile:unknown} requestId=%X{requestId:-} correlationId=%X{correlationId:-} traceId=%X{traceId:-} spanId=%X{spanId:-}]"
