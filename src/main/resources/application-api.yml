spring:
  main:
    web-application-type: servlet
  datasource:
    url: ${API_DATABASE_URL}
    username: ${API_DATABASE_USERNAME}
    password: ${API_DATABASE_PASSWORD}
  flyway:
    enabled: false
  task:
    scheduling:
      enabled: false

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,startupState,rateLimit
        startup:
          include: startupState

mychandha:
  runtime:
    profile: api

---
spring:
  config:
    activate:
      on-profile: production
  datasource:
    hikari:
      data-source-properties:
        sslmode: verify-full
        sslrootcert: ${API_DATABASE_SSL_ROOT_CERTIFICATE}
