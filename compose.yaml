services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mychandha
      POSTGRES_USER: mychandha_app
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mychandha_app -d mychandha"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
